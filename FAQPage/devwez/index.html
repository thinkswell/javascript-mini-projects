<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ — Quick Answers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <header class="hero">
      <p class="eyebrow">FAQ &middot; Help Center</p>
      <h1>Quick answers,<br><span>no fluff.</span></h1>
      <p class="sub">Search or browse. Everything we get asked, distilled to the essentials.</p>
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="text" placeholder="Search — try 'shipping', 'refund', 'account'..." autocomplete="off" />
        <span class="kbd">/</span>
      </div>
    </header>

    <div class="meta">
      <span id="count">6 questions</span>
      <span class="dot"></span>
      <span>Updated today</span>
      <button id="expandAll">Expand all</button>
    </div>

    <div class="faq-list" id="faqList">
      <!-- items injected by JS -->
    </div>

    <footer>
      <p>Didn't find it? <a href="mailto:help@example.com">Contact support</a> — we reply in &lt; 24h.</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
